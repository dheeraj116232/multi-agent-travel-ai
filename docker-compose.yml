version: '3.8'

services:
  app:
    build: .
    ports:
      - "${PORT:-8501}:8501"
    environment:
      - ENV=${ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - AVIATIONSTACK_API_KEY=${AVIATIONSTACK_API_KEY}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_CALLS=${RATE_LIMIT_CALLS:-4}
    volumes:
      - ./travel_plans:/app/travel_plans
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - production

  dev:
    build: .
    ports:
      - "8501:8501"
    environment:
      - ENV=development
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_CALLS=4
    volumes:
      - .:/app
      - ./travel_plans:/app/travel_plans
      - ./logs:/app/logs
    command: streamlit run frontend.py --server.port=8501 --server.headless=true
    profiles:
      - development